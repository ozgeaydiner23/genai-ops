apiVersion: v1
kind: Secret
metadata:
  name: genai-ops-secret
  namespace: genai-ops
  labels:
    app: genai-ops
type: Opaque
stringData:
  # Database Password
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  
  # LDAP Bind Password (Vpara Active Directory Service Account)
  # Service Account: CN=srvc.ldap_prd,OU=VFTR_Admin,OU=VPARA,DC=vpara,DC=local
  # IT ekibinden alınacak
  LDAP_BIND_DN: "CN=srvc.ldap_prd,OU=VFTR_Admin,OU=VPARA,DC=vpara,DC=local"
  LDAP_BIND_PASSWORD: "CHANGE_ME_LDAP_SERVICE_ACCOUNT_PASSWORD"
  
  # LLM API Token (JWT token or API key for Bearer authentication)
  # This token is sent as: Authorization: Bearer <token>
  LLM_API_TOKEN: "CHANGE_ME_LLM_JWT_TOKEN_OR_API_KEY"
  
  # JWT Secret (minimum 256 bits)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY_MINIMUM_256_BITS_REQUIRED"
  
  # Admin Password
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
